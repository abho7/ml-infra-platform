name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is committed, already built from a real run on a real machine.
      # Rebuilding it in CI would mean the published benchmark numbers came
      # from a shared GitHub runner under unknown contention, which is a worse
      # measurement, not a fresher one. CI publishes; it does not measure.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deploy
        uses: actions/deploy-pages@v4
